# ZMK Studio / DYA Studio (Central)
CONFIG_ZMK_STUDIO=y
# Studioのロック解除操作(&studio_unlock)を不要に
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000

# ホスト向けバッテリー残量通知(BAS)を無効化(省電力)
# バッテリー履歴・LED表示はローカルADC/左右間フェッチのため影響なし
# ※Windowsにバッテリー%が表示されなくなるのは仕様
CONFIG_BT_BAS=n

# RGB LEDステータス表示(caksoylar/zmk-rgbled-widget)
CONFIG_RGBLED_WIDGET=y
# セントラルは左右両方のバッテリー状態を表示
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y
