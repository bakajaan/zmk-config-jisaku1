# ========================================
# Left half (Central) 専用設定
# Studio RPCは左ハーフ（central / USB持ち）のみ有効
# ========================================

# 【一時デバッグ】DYA Studio接続時のUSB切断ループの原因調査のため、USBログを有効化。
# ボード既定のUSBシリアルコンソール(CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM, 既定y)を
# ログ出力先として使うため、無効化(=n)は一時的に解除している。
# USB接続時にCOMポートが2つ見える:
#   - ログ用コンソール (Tera Term等のシリアルターミナルで開く / ボーレート115200)
#   - Studio RPC用ポート (DYA Studioで開く)
# 調査完了後: このデバッグブロックを削除し、CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n を復活させること。
CONFIG_ZMK_USB_LOGGING=y
# CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
# 注意: CONFIG_LOG_MODE_IMMEDIATE=y は使用禁止。
# 割り込み内での同期ログ出力がBLE/LEDのタイミングを壊し、
# LED無反応・ペアリング不能になることを確認済み(2026-07-26)。
# 代わりに遅延モードのままバッファ拡大＋高頻度フラッシュで
# クラッシュ直前（約10ms前まで）のログを残す。
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
# Studio RPC処理（リクエスト/レスポンス選択等）の詳細ログ
CONFIG_ZMK_STUDIO_LOG_LEVEL_DBG=y
# 起動時に登録済みカスタムサブシステム一覧を出力（登録情報の破損チェック）
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_PRINT_LIST_ON_START=y

# 【一時デバッグ: スタックオーバーフロー確定用】
# クラッシュはkeymapサブシステム(subsystem tag=5)の最初のリクエスト(get_keymap)で発生しており、
# キーマップ全体をnanopbで多段エンコードするRPCスレッドのスタック不足が有力候補。
# rpc.cは各リクエストの前後で thread_analyzer_print() を呼ぶ（CONFIG_THREAD_ANALYZER有効時）ので、
# get_keymap直前のstudio_rpc_threadのスタック使用量(残量)がログに出る。
# HW_STACK_PROTECTIONでオーバーフロー時に即座にMPUフォールト(ログ出力)となり、無言の再起動を防ぐ。
# 調査完了後はこのブロックごと削除すること。
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_USAGE=y
CONFIG_ASSERT=y
CONFIG_HW_STACK_PROTECTION=y

# ZMK Studio
CONFIG_ZMK_STUDIO=y
# 注意: STUDIO_LOCKING は既定値(y)のままにすること。
# LOCKING有効時のみ ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK が働き、
# &studio_unlock 押下時にBLE広告を再開して Web Bluetooth (DYA Studio/公式Studio) から
# キーボードを検出できるようになる。
# CONFIG_ZMK_STUDIO_LOCKING=n にするとホスト接続中は広告が止まり、
# StudioがBLEでキーボードを発見できなくなる（過去に発生済み）。

# 【切り分け中】&studio_unlock 押下直後に切断が発生するため、unlock時のBLE広告再開
# (fork独自機能)を一時的に無効化。実装上、接続中にオープン広告を開始する暫定コードに
# なっており、既存接続を乱す疑いがある。
# 副作用: この間はBLE経由でのStudio検出は不可（USB経由は可）。
CONFIG_ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK=n

# ロック解除の手間を軽減 (電源投入後に一度 &studio_unlock を押せばOK):
# - Studio切断時の自動再ロックを無効化
# - アイドル再ロックを10分→1時間に延長
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=3600

# BLE接続数上限
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# BLE管理 + Studio RPC
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# バッテリー履歴 + Studio RPC
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# スプリット経由で右ハーフ（peripheral）のバッテリー情報を取得
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 設RPC + Studio RPC
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# デバイス情報 + Studio RPC
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

# ウォッチドッグ + Studio RPC
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# kscan診断 Studio RPC
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y

# DYA Studio 安定化
# 【有力修正】get_keymapの多段nanopbエンコードでRPCスレッドのスタックが不足している疑いが強いため、
# 4096 -> 8192 に増量。上のTHREAD_ANALYZERで実際の使用量を確認できる。
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=8192
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256

# スプリットリレーイベント
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

# フラッシュ書き込み頻度を右と統一
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000

# ホスト向けバッテリー残量通知(BAS)を無効化 (aerogu34と統一)
CONFIG_BT_BAS=n

# RGB LEDステータス表示
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y
