# ========================================
# Left half (Central) 専用設定
# Studio RPCは左ハーフ（central / USB持ち）のみ有効
# ========================================

# Zephyr 4 xiao_ble は既定でUARTコンソールを2つ目のUSB CDC ACMにバインドし、
# DYA Studioが開く studio-rpc-usb-uart エンドポイントと衝突するため、
# ボード既定のシリアルバックエンドを無効化して Studio RPC 用 CDC ACM のみを公開する。
# ※ デパッグでUSBログが必要な場合はこれを一時解除し CONFIG_ZMK_USB_LOGGING=y を追加。
#    その際 CONFIG_LOG_MODE_IMMEDIATE=y は使用禁止
#    （LED無反応・ペアリング不能になることを確認済み 2026-07-26）。
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# 【保険 2026-07-26】USB CDC-ACMの内部リングバッファ拡大（既定1024）。
# forkのuart_rpc_transport.c serial_cbのTXループは、ホストがポートを読まなくなると
# CDCバッファ満杯→無限ループ化し、USB全体(HID含む)が凍結する問題がある（cormoranへ報告予定）。
# 凍結の引き金だったクライアント側バグ(react-zmk-studioのタイムアウト改修)は
# dya-studio fork側でSHA固定により修正済みだが、ファーム側の保険として維持する。
# (get_keymapは全レイヤー分で数KBになるため8192を確保)
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=8192

# ZMK Studio
CONFIG_ZMK_STUDIO=y
# 注意: STUDIO_LOCKING は既定値(y)のままにすること。
# LOCKING有効時のみ ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK が働き、
# &studio_unlock 押下時にBLE広告を再開して Web Bluetooth (DYA Studio/公式Studio) から
# キーボードを検出できるようになる。
# CONFIG_ZMK_STUDIO_LOCKING=n にするとホスト接続中は広告が止まり、
# StudioがBLEでキーボードを発見できなくなる（過去に発生済み）。

# 【2026-07-26 復帰】接続凍結の真犯人はDYA Studioクライアント側ライブラリ
# (react-zmk-studioのタイムアウト改修)と確定し、dya-studio fork側でSHA固定により修正済み。
# BLE経由でのStudio検出を復活させるため、unlock時のBLE広告再開を再度有効化する。
# 既知の注意点: fork実装は接続中にオープン広告を開始する暂定コードのため、
# &studio_unlock 押下時に既存BT接続が一瞬乱れる可能性あり。
# 許容できない場合は =n に戻すこと（その間BLEでのStudio検出は不可、USB経由は可）。
CONFIG_ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK=y

# ロック解除の手間を軽減 (電源投入後に一度 &studio_unlock を押せばOK):
# - Studio切断時の自動再ロックを無効化
# - アイドル再ロックを10分→1時間に延長
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=3600

# 【2026-07-26】Studio接続中のBLE低遅延化（BLEキーマップ読込中の切断ループ対策その1・aerogu34と統一）。
# 通常時は BT_PERIPHERAL_PREF_LATENCY=10 で省電力化しているが、ZMKのStudio用低遅延切替は
# 「TRANSPORT_BLE_PREF_LATENCY < BT_PERIPHERAL_PREF_LATENCY」の場合のみコンパイルされる
# （両方とも既定/設定値10のため 10<10=偽 となり切替コードごと無効化されていた）。
# 0にするとStudioのIndication購読中だけ latency 0 を要求し、27バイト×ACK往復で行われる
# キーマップ転送が大幅に高速化する。Studio切断時は自動で latency 10 に復帰するため
# 通常使用時の電池持ちへの影響はない。
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=0

# BLE接続数上限
# 【2026-07-27】同時接続数を 6 → 4 に削減（LL_ASSERT対策）。
# コントローラは接続ごとに無線イベント枠を確保するため、上限が大きいほど
# スケジュールが詰まりやすい。実際に必要なのは「ホスト1 + 右ハーフ1 + 遷移中の余裕」で、
# ペアリング済みプロファイル数は BT_MAX_PAIRED 側で決まるので登録済みプロファイルは失われない。
# ※ ホストに繋がらない等の症状が出たら 6 に戻すこと。
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=6

# BLE管理 + Studio RPC
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# バッテリー履歴 + Studio RPC
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# スプリット経由で右ハーフ（peripheral）のバッテリー情報を取得
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 設RPC + Studio RPC
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# デバイス情報 + Studio RPC
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

# ウォッチドッグ + Studio RPC
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# 【2026-07-26】フリーズ誤検知対策（BLEキーマップ読込中の切断ループ対策その2・aerogu34と統一）。
# Studio BLE転送中はRPC送信ミューテックスを長時間保持するため、その間に発生した
# Studio通知の送信処理がワークキュー上でブロックする。既定10秒のままだと正常な
# 大型転送(キーマップ読込)をフリーズと誤検知して再起動→切断→再接続ループになる。
CONFIG_ZMK_WATCHDOG_FREEZE_TIMEOUT_MS=60000
# 低優先度キュー監視を停止。上記の誤検知経路を除去しつつ、モジュール作者が
# DESIGN.mdで注意喚起しているスプリットセントラルの無線タイミング起因再起動
# (LL_ASSERT_OVERHEAD)への緩和策として周期feedタイマーを半減する。
CONFIG_ZMK_WATCHDOG_FREEZE_MONITOR_LOWPRIO_QUEUE=n

# 【2026-07-27】BLEコントローラのアサート内容を記録する。
# これを入れないと LL_ASSERT 失敗が素の k_oops になり、記録は
# 「PC 0x00051746 / LR 0x00051737 / スレッド idle」のようにELFなしでは解読不能な値だけになる。
# 有効化すると bt_ctlr_assert_handle() が呼ばれ、
# 「スレッド名」欄にアサート元ファイル名、「PC」欄に行番号が入るため、
# どのアサートが発火したのか（開発用アサートか本当のスケジュール溢れか）を特定できる。
# ※ このオプションが CONFIG_BT_CTLR_ASSERT_HANDLER を自動で有効化する。
#   他のモジュールで bt_ctlr_assert_handle() を定義しないこと（多重定義になる）。
CONFIG_ZMK_CTLR_ASSERT_INFO=y

# kscan診断 Studio RPC
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y

# ========================================
# ランタイムマクロ / ランタイムコンボ (DYA Studio Macro & Comboタブ 2026-07-26追加)
# 挙動はCentral(左)で実行されるため左のみで有効化
# ========================================
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
# カスタムサブシステムRPCのペイロード上限 (runtime-macro READMEの推奨値192)
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=192
# 低優先度ワーカースレッドのスタック【2026-07-26: 2048→4096 クラッシュ対策】
# ウォッチドッグのクラッシュ記録でスタックオーバーフロー3件（起動後19〜92秒・Studio使用中）を確認。
# このスレッドはruntime-macroの保存/読込に加え、battery-history/input-stream等の
# nanopbエンコード（スタック消費大）を共有するため増量する。
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
# マクロ本体(既定最大256B)を1エントリで保存できるようにする
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
# 注意: READMEは CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y も推奨するが、
# 切替は実機に保存済みのランタイムキーマップ(local id採番)を無効化するため未設定。
# Kconfig上の必須要件は ZMK_BEHAVIOR_LOCAL_IDS (既定settings table方式) のみ。
# マクロのキー割当が再起動で外れる等の問題が出た場合のみ、
# DYA Studioでプロファイル保存→CRC16有効化→フラッシュ→プロファイル復元で切替えること。

# ========================================
# 入力ストリーム / カスタム設定 / OS検出 / デフォルトレイヤー (DYA Studio 2026-07-26追加)
# ========================================
# 入力ストリーム: DYA StudioのInsights(打鍵ヒートマップ)とKeymapタブのStreamトグル用。
# これが無いと実機接続時に「入力ストリームサブシステムが利用できません」となる（デモのみ表示）。
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

# カスタム設定 + Studio RPC: 設定タブの「詳細設定」表示に必須。
# これまでCUSTOM_SETTINGS本体はruntime-macro依存で有効だったがRPCが無効だったため
# jisakuでは詳細設定セクションが表示されなかった。
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y

# OS検出: USB/BLE接続先のOSを推定してStudioへ通知（接続タブの「OS追従」用）
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

# デフォルトレイヤー切替: 接続先/OSごとの基本レイヤー切替（接続タブ）。
# 候補レイヤーは0〜4（jisaku_1は5レイヤー構成）。レイヤーを増やしたらMAX_INDEXも更新すること。
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=4

# ========================================
# 打鍵統計 (キーボード側保存のヒートマップ 2026-07-27追加)
# ========================================
# Studioを開いていない間の打鍵も数え、電源を切っても保持する。
# - (レイヤー, キー位置) 別カウンタ … 物理ヒートマップとレイヤー使用率用
# - HIDキーコード別カウンタ … 「Aを何回打ったか」。キーマップ変更やコンボ/マクロ経由の出力にも強い
# スプリットの右(peripheral)側は設定不要。打鍵はセントラルに中継されるためここで数えられる。
CONFIG_ZMK_KEY_USAGE=y
CONFIG_ZMK_KEY_USAGE_STUDIO_RPC=y
CONFIG_ZMK_KEY_USAGE_TRACK_KEYCODES=y
# jisaku_1は5レイヤー構成 + 予備1
CONFIG_ZMK_KEY_USAGE_MAX_LAYERS=6
# 両ハーフ合計のキー数以上にすること (RAM: MAX_LAYERS × MAX_POSITIONS × 2バイト)
CONFIG_ZMK_KEY_USAGE_MAX_POSITIONS=64
# フラッシュ書き込みは最短5分間隔 + アイドル/スリープ時 + Studioからの明示保存のみ
CONFIG_ZMK_KEY_USAGE_SAVE_DEBOUNCE_MINUTES=5

# ========================================
# Devtool (スレッドスタック監視 + ログキャプチャ 2026-07-27追加)
# ========================================
# cormoran__devtool サブシステム: スタックの高水位線・ログをDYA Studioで確認できる。
# スタックオーバーフロー起因のウォッチドッグクラッシュの原因特定に有用。
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
# スレッドごとのスタック使用量（高水位線）をStudioで確認
CONFIG_ZMK_DEVTOOL_STACK_USAGE=y
# ログをStudio RPC経由で取得（デバッグプローブ不要）
CONFIG_ZMK_DEVTOOL_LOG_CAPTURE=y

# ========================================
# Fast keymap (高速キーマップ読込 2026-07-27追加)
# ========================================
# フィンガープリントキャッシュにより2回目以降のキーマップ読込をほぼ即座に完了させる。
# main+dyaブランチ(zmk_stock_keymap_get_layer_binding_at_idx)を使用しているため
# デフォルト/編集差分(DEFAULT_LAYER)も有効化する。
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y

# DYA Studio 安定化
# スタック実測(2026-07-26): キーマップ処理直前で最大約2000使用 → 4096で十分（aerogu34と統一）。
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256

# 【2026-07-26】システムワークキューのスタック増量。
# ウォッチドッグ記録に sysworkq のフリーズ1件と、スレッド特定不能のスタックオーバーフローがあり、
# sysworkqではBLE/バッテリー/設定保存/サブシステム通知など多数の処理が動くため余裕を持たせる。
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ========================================
# 【2026-07-26 追加】上記スタック増量を適用したファームでも
# BLEキーマップ読込中の切断(GATT Server is disconnected)が再現するため、
# 残る候補を潰し、次回のクラッシュで原因が一意に特定できるようにする。
# ========================================
# スレッド名を保持し、スタックを越えた瞬間にMPUで例外を発生させる。
# これがないと隣のメモリを黙って壊してから崩壊するため、
# ウォッチドッグの記録がPC/LRのごみ値だけになり原因スレッドが分からない。
CONFIG_THREAD_NAME=y
CONFIG_HW_STACK_PROTECTION=y
# 未増量だったスタック。init処理とBLE受信スレッドは
# 設定読込とGATTコールバック経由でStudio RPCの処理を抱えるため余裕を持たせる。
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048
# StudioはIndicationを連続送信するため、既定の少ないTXバッファでは
# セントラル側(右ハーフ接続)と競合して送信失敗→リンク断になりうる。
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_CONN_TX_MAX=10
# 監視タイムアウトを4秒に延長（既定は42×10ms=420ms相当の短さ）。
# 大型転送中に数インターバル取りこぼしても即切断にならないようにする。
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# スプリットリレーイベント
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# aerogu34と統一 (2026-07-26: 768→2048)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=2048

# フラッシュ書き込み頻度を右と統一
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000

# 【2026-07-26 復活】標準バッテリーサービス(BAS)を有効化 (aerogu34と統一)。
# BAS無効化はホスト/DYA Studioでの残量0%表示の原因だった。=n には戻さないこと。
CONFIG_BT_BAS=y

# RGB LEDステータス表示
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y
# バッテリー残量LEDの閾値 (aerogu34と統一: 40%未満=黄, 20%未満=赤)
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=40
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20
