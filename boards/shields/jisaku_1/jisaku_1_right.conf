# ========================================
# Right half (Peripheral) 専用設定
# Studio RPC機能は左ハーフ（central）のみ。建築時は jisaku_1.conf とのマージ順序を考慮。
# ========================================

# RGB LEDステータス表示
CONFIG_RGBLED_WIDGET=y

# バッテリー履歴（スプリット経由でセントラルへ転送）
CONFIG_ZMK_BATTERY_HISTORY=y

# 設RPC（スプリット経由で動作）
CONFIG_ZMK_SETTINGS_RPC=y

# スプリットリレーイベント
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# フラッシュ書き込み頻度を左と統一
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000
