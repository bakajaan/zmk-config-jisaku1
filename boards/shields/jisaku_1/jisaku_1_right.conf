# ========================================
# Right half (Peripheral) 専用設定
# ========================================

# RGB LEDステータス表示
CONFIG_RGBLED_WIDGET=y

# バッテリー履歴（RPCなし、スプリット経由でセントラルへ転送）
CONFIG_ZMK_BATTERY_HISTORY=y

# 設定RPC（スプリット経由で動作するが、Studio RPCは無効）
CONFIG_ZMK_SETTINGS_RPC=y

# スプリットリレーイベント（ペリフェラルで必要）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# kscan-diagnosticsのリレーに必要（両ハーフで必須）
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

# ========================================
# Studio RPC は右ハーフ（peripheral）では無効
# （USB/Studio接続は左ハーフのみ）
# jisaku_1.conf の _STUDIO_RPC=y をここで上書き
# ========================================
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=n
CONFIG_ZMK_SETTINGS_RPC_STUDIO=n
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=n
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=n
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=n

# フラッシュ書き込み頻度を左と統一（省電力・フラッシュ寿命）
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000
