# 接続安定化(実験的BLE改善: 2M PHY無効化＋セキュリティ改善を含む)
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# TX出力+8dBm(左右間・ホスト接続のリンク確立を安定化、再接続リトライ削減)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 省電力(40mAhバッテリー向け): 60分無操作でディープスリープ
# 日中の離席はアイドル状態(BLE接続維持・即時復帰)に留める運用
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# バッテリー報告間隔を60秒→10分に(省電力)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600

# BLE接続パラメータ(応答性優先)
# 接続間隔7.5〜15ms(6/12はv0.3デフォルト値の明示)、ペリフェラルレイテンシ30→10で左右間の応答性を改善
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10

# マウスエミュレーション(マウスレイヤー用)
CONFIG_ZMK_POINTING=y

# ソフトオフ(&soft_offキーで電源断、保管・持ち運び時のバッテリー節約)
CONFIG_ZMK_PM_SOFT_OFF=y
