# ========================================
# DYA Studio モジュール（両ハーフ共通部分のみ）
# Studio / Studio RPC 系設定は jisaku_1_left.conf へ移動済み
# BLE管理（BLE_MANAGEMENT）は Central のみ有効にする → jisaku_1_left.conf で設定
# ========================================

# バッテリー履歴
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# バッテリー報告 (DYA Studio経由のデータ収集用・左右共通。BT_BAS=nのためOSへの通知はなし)
CONFIG_ZMK_BATTERY_REPORTING=y

# 設定RPC（スプリット経由で両ハーフで動作。Studio RPCは左ハーフ専用）
CONFIG_ZMK_SETTINGS_RPC=y

# デバイス情報
CONFIG_ZMK_DEVICE_INFO=y

# ウォッチドッグ（freeze検出含むフル機能。デバッグ中の一時無効化は2026-07-26に解除済み）
CONFIG_ZMK_WATCHDOG=y

# キースキャン診断（スプリット対応）
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
# kscan-diagnosticsのリレーに必要（両ハーフ必須）
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

# 設定永続化
# ※ config/ (app) レベルで書くと shield レベル（60000ms）を上書きしてしまうため
#   ここには記載しない。左右それぞれ jisaku_1_left.conf / jisaku_1_right.conf で設定済み。

# ========================================
# BLE
# ========================================
# aerogu34 と統一: CONN のみ（接続安定化のみ・セキュリティ実験的機能は含まない）
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# 送信出力 +8dBm は維持する。無線イベントのスケジューリング余裕とは無関係で、
# 下げるとスプリット間リンクの再送が増えて逆効果になるため。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_DIS=y
# 【2026-07-27】希望接続間隔の下限を 7.5ms(6) → 15ms(12) に緩和。
# ウォッチドッグに idle スレッドの Kernel Oops (BLEコントローラのLL_ASSERT) が
# 3件記録されており、上流でもnRF52の多重リンク+短間隔時に
# LL_ASSERT_OVERHEAD（無線イベントを予定時刻に詰め込めない）が報告されている。
# ホスト接続・スプリット接続・Studioの通知が同一の無線スケジュールを共有するため、
# 下限を広げて1イベントあたりの余裕を作る。
# 体感遅延はStudio接続中の latency 0 指定で担保されるので通常打鍵への影響はない。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10

# ========================================
# 省電力
# ========================================
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600
CONFIG_ZMK_PM_SOFT_OFF=y

# ========================================
# キースキャン
# ========================================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ========================================
# ポインティング（キーマップで mkp を使用するため必要）
# POINTING_SMOOTH_SCROLLING はトラックボール向けのため jisaku_1 では不要
# ========================================
CONFIG_ZMK_POINTING=y
